<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="一个由 HTML 文章索引与 Markdown 正文组成的极简单页博客。">
  <title>文章笔记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="site-shell" id="site-shell">
    <header class="site-header">
      <p class="site-kicker">HTML · MARKDOWN · NOTES</p>
      <h1 class="site-title">文章笔记</h1>
      <p class="site-desc">一个只维护文章索引与 Markdown 正文的极简单页博客。</p>
    </header>

    <section class="article-section" aria-labelledby="article-list-title">
      <div class="section-head">
        <h2 id="article-list-title">文章</h2>
        <span class="article-count" id="article-count">0 篇</span>
      </div>

      <div class="article-list" id="article-list" aria-live="polite"></div>
    </section>

    <footer class="site-footer">
      <span>HTML MD Blog</span>
      <span>GitHub Pages</span>
    </footer>
  </main>

  <div class="reader" id="reader" aria-hidden="true">
    <div class="reader-panel" role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <header class="reader-toolbar">
        <button class="reader-close" id="reader-close" type="button" aria-label="关闭文章">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <div class="reader-scroll" id="reader-scroll">
        <article class="reader-article">
          <p class="reader-meta" id="reader-meta"></p>
          <h2 class="reader-title" id="reader-title"></h2>
          <div class="reader-divider" aria-hidden="true"></div>

          <div class="reader-status" id="reader-status" role="status" aria-live="polite"></div>
          <div class="markdown-body" id="reader-body"></div>
        </article>
      </div>
    </div>
  </div>

  <!-- ============================================================
       文章索引：以后新增、删除、修改文章时，日常只维护这里和 articles/。
       file  = Markdown 文件名
       date  = 显示日期
       title = 博客列表与阅读层主标题
       数组顺序 = 页面显示顺序
       ============================================================ -->
  <script>
    window.BLOG_POSTS = [
      {
        file: "004.md",
        date: "2026-08-14",
        title: "后期如何新增一篇文章"
      },
      {
        file: "003.md",
        date: "2026-08-14",
        title: "Markdown 排版样式完整测试"
      },
      {
        file: "002.md",
        date: "2026-08-13",
        title: "为什么使用全屏右侧抽屉阅读"
      },
      {
        file: "001.md",
        date: "2026-08-12",
        title: "欢迎使用 HTML MD Blog"
      }
    ];
  </script>

  <!-- Marked：只负责把 Markdown 转换为 HTML。 -->
  <script src="js/marked.umd.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
